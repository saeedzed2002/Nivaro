# P02 database foundation. Optional until the backend image has a verified lock.
# Start with: docker compose -f compose.yaml -f compose.catalog.yaml up -d postgres
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - catalog_db_password
    volumes:
      - catalog_postgres:/var/lib/postgresql
      - ./infra/postgres/10-catalog.sh:/docker-entrypoint-initdb.d/10-catalog.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  catalog_postgres:
secrets:
  postgres_admin_password:
    file: ./work/secrets/postgres_admin_password.txt
  catalog_db_password:
    file: ./work/secrets/catalog_db_password.txt
