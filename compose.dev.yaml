services:
  web:
    image: nivaro-web:development
    build:
      target: development
    command: [node, node_modules/next/dist/bin/next, dev, --webpack, --hostname, 0.0.0.0]
    environment:
      # Poll inside the container so refresh does not depend on events from a Compose sync.
      WATCHPACK_POLLING: '750'
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./apps/web/public
          target: /app/public
          initial_sync: true
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/pnpm-lock.yaml
        - action: rebuild
          path: ./apps/web/pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/web/next.config.ts
