# Private support HTTP and WebSocket endpoints behind the gateway.
services:
  identity:
    environment:
      IDENTITY_SUPPORT_SERVICE_KEY_FILE: /run/secrets/support_identity_service_key
    secrets: [support_identity_service_key]
  support-db-init:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc}
    environment:
      PGHOST: postgres
      POSTGRES_USER: postgres
    secrets: [postgres_admin_password, support_db_password]
    volumes:
      - ./infra/postgres/60-support.sh:/init-support.sh:ro
    command: [sh, /init-support.sh]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  support-init:
    image: ${NIVARO_SUPPORT_IMAGE:-nivaro-support:release}
    build:
      context: ./services/support
      target: release
    environment:
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-180}
    secrets: [support_db_password]
    command: [alembic, upgrade, head]
    depends_on:
      support-db-init:
        condition: service_completed_successfully
    restart: 'no'
  redis-support:
    image: redis:8.10.3@sha256:0c257ce8b2f31f9f7595f587edf8ac259a248ba3ced82badc8c7aa826a85224f
    user: redis
    command: [sh, /etc/redis/start-support.sh]
    secrets: [redis_support_password]
    volumes:
      - ./infra/redis/start-support.sh:/etc/redis/start-support.sh:ro
    networks: [support-chat]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_support_password) redis-cli --user support ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5
  support: &support-service
    image: ${NIVARO_SUPPORT_IMAGE:-nivaro-support:release}
    environment:
      SUPPORT_ALLOWED_ORIGINS: '${SUPPORT_ALLOWED_ORIGINS:-["http://127.0.0.1:8080","http://localhost:8080"]}'
    secrets: [support_db_password, support_identity_service_key, redis_support_password]
    networks: [default, support-chat]
    depends_on:
      support-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      redis-support:
        condition: service_started
    expose: ['8000']
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  support-replica:
    <<: *support-service
    profiles: [support-replica]
secrets:
  support_db_password:
    file: ./work/secrets/support_db_password.txt
  support_identity_service_key:
    file: ./work/secrets/support_identity_service_key.txt
  redis_support_password:
    file: ./work/secrets/redis_support_password.txt
networks:
  support-chat:
    internal: true
