# Use last with the media, development, orders, events, payments and support overlays.
services:
  web:
    image: nivaro-web:local-development
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro
    develop:
      watch: !override
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/pnpm-lock.yaml
        - action: rebuild
          path: ./apps/web/pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/web/next.config.ts
  catalog:
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - ./services/catalog/src:/workspace/src:ro
    command: [uvicorn, nivaro_catalog.main:app, --host, 0.0.0.0, --reload, --reload-dir, /workspace/src, --no-access-log]
  identity:
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - ./services/identity/src:/workspace/src:ro
    command: [uvicorn, nivaro_identity.main:app, --host, 0.0.0.0, --reload, --reload-dir, /workspace/src, --no-access-log]
  cart:
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - ./services/cart/src:/workspace/src:ro
    command: [uvicorn, nivaro_cart.main:app, --host, 0.0.0.0, --reload, --reload-dir, /workspace/src, --no-access-log]
  orders:
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - ./services/orders/src:/workspace/src:ro
    command: [uvicorn, nivaro_orders.main:app, --host, 0.0.0.0, --reload, --reload-dir, /workspace/src, --no-access-log]
  payments:
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - ./services/payments/src:/workspace/src:ro
    command: [uvicorn, nivaro_payments.main:app, --host, 0.0.0.0, --reload, --reload-dir, /workspace/src, --no-access-log]
  support:
    environment:
      PYTHONPATH: /workspace/src
      UVICORN_RELOAD: 'true'
      UVICORN_RELOAD_DIRS: /workspace/src
    volumes:
      - ./services/support/src:/workspace/src:ro
