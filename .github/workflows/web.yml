name: Catalog identity and web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm lint
      - name: Initialize isolated CI secrets
        shell: pwsh
        working-directory: .
        run: ./scripts/Initialize-LocalSecrets.ps1
      - name: Build and start release containers with fresh schema
        working-directory: .
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose build catalog-init identity-init web
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8080/health/ready
      - name: Catalog checks and canonical OpenAPI drift
        working-directory: .
        run: |
          docker build --target test -t nivaro-catalog:test services/catalog
          docker run --rm --network nivaro_default -e CATALOG_DB_HOST=postgres \
            -v "$PWD/work/secrets/catalog_db_password.txt:/run/secrets/catalog_db_password:ro" \
            -v "$PWD/contracts:/contracts:ro" nivaro-catalog:test \
            sh -c 'ruff check . && ruff format --check . && mypy src && pytest -q && alembic check && python -m nivaro_catalog.export_openapi /contracts/openapi/catalog.json --check'
      - name: Build identity test image
        working-directory: .
        run: docker build --target test -t nivaro-identity:test services/identity
      - name: Identity database isolation sessions and OpenAPI
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-IdentityService.ps1 -TestImage 'nivaro-identity:test'
      - name: Build host preview against catalog gateway
        env:
          CATALOG_URL: http://127.0.0.1:8080
        run: pnpm build && pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: Host browser verification
        env:
          TEST_BASE_URL: http://127.0.0.1:8081
          CATALOG_URL: http://127.0.0.1:8080
        run: |
          pnpm start --port 8081 > /tmp/nivaro-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health/ready; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - name: Verify container-served storefront
        run: pnpm test:e2e
      - name: Identity browser journeys on a disposable stack
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-IdentityBrowser.ps1
      - name: Verify database visibility and catalog outage recovery
        env:
          NIVARO_DEMO_RUNTIME_CHECK: '1'
        run: node scripts/verify-catalog-runtime.mjs
      - name: Verify development file sync and hot reload
        working-directory: .
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait --wait-timeout 120
          docker compose -f compose.yaml -f compose.dev.yaml watch --no-up > /tmp/nivaro-watch.log 2>&1 &
          watch_pid=$!
          trap 'kill "$watch_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if grep -q 'Watch enabled' /tmp/nivaro-watch.log; then break; fi
            sleep 1
          done
          grep -q 'Watch enabled' /tmp/nivaro-watch.log
          node apps/web/scripts/verify-watch.mjs
      - name: Container diagnostics
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 100
      - name: Stop CI containers
        if: always()
        working-directory: .
        run: docker compose down
