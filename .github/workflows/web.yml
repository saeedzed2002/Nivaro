name: Catalog identity and web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-processing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build frozen image-processing test image
        run: docker build --target test -t nivaro-image-processing:test packages/python/image_processing
      - name: Verify image validation and transformations without network
        run: docker run --rm --network none nivaro-image-processing:test
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the frozen web browser test dependencies
        working-directory: apps/web
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: 'v5.5.1'
          cache-binary: false
      - name: Build frozen support, identity and web images
        run: |
          docker build --target release -t nivaro-support:release services/support
          docker build --target test -t nivaro-support:test services/support
          docker build --build-context image-processing=./packages/python/image_processing --target release -t nivaro-identity:release services/identity
          docker compose build web
          docker compose -f compose.yaml -f compose.support.yaml pull postgres redis-state gateway
      - name: Verify private conversations across replicas and through the browser gateway
        shell: pwsh
        run: ./scripts/Verify-SupportFoundation.ps1 -Browser
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm lint
      - name: Initialize isolated CI secrets
        shell: pwsh
        working-directory: .
        run: |
          ./scripts/Initialize-LocalSecrets.ps1
          ./scripts/Initialize-MediaSecrets.ps1
      - name: Set up Docker Compose with initial Watch sync
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: 'v5.5.1'
          cache-binary: false
      - name: Build and start release containers with fresh schema
        working-directory: .
        run: |
          docker compose version
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose build catalog-init identity-init cart-init web
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8080/health/ready
      - name: Catalog checks and canonical OpenAPI drift
        working-directory: .
        shell: pwsh
        run: |
          docker build --build-context image-processing=./packages/python/image_processing --target test -t nivaro-catalog:test services/catalog
          if ($LASTEXITCODE -ne 0) { throw 'Catalog test image build failed.' }
          ./scripts/Verify-CatalogFresh.ps1 -TestImage nivaro-catalog:test
      - name: Build identity test image
        working-directory: .
        run: docker build --build-context image-processing=./packages/python/image_processing --target test -t nivaro-identity:test services/identity
      - name: Identity database isolation sessions and OpenAPI
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-IdentityService.ps1 -TestImage 'nivaro-identity:test'
      - name: Build frozen Payments images
        working-directory: .
        run: |
          docker build --target test -t nivaro-payments:test services/payments
          docker build --target release -t nivaro-payments:release services/payments
      - name: Verify private payment simulation and broker recovery
        working-directory: .
        shell: pwsh
        run: |
          docker pull rabbitmq:4.4.0-management@sha256:d6e0b463f6b4e1e840da82f28aa117c00b1b6a3009b1f418bd270741de0d8871
          if ($LASTEXITCODE -ne 0) { throw 'Pinned broker image download failed.' }
          ./scripts/Verify-PaymentsFoundation.ps1 -WithEvents
      - name: Build cart foundation test image
        working-directory: .
        run: docker build --target test -t nivaro-cart:test services/cart
      - name: Cart foundation migrations ownership and limits
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-CartFoundation.ps1 -TestImage 'nivaro-cart:test'
      - name: Build Orders foundation images
        working-directory: .
        run: |
          docker build --target test -t nivaro-orders:test services/orders
          docker build --target release -t nivaro-orders:release services/orders
      - run: pnpm exec playwright install --with-deps chromium
      - name: Orders checkout reservation recovery and durable broker events
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-OrdersFoundation.ps1 -WithPaymentResults -Browser
      - name: Build host preview against the local gateway
        env:
          CATALOG_URL: http://127.0.0.1:8080
          NIVARO_WEB_PREVIEW_GATEWAY: http://127.0.0.1:8080
        run: pnpm build && pnpm typecheck
      - name: Cart browser integration through gateway
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-CartGateway.ps1 -Browser
      - name: Host browser verification
        env:
          TEST_BASE_URL: http://127.0.0.1:8081
          CATALOG_URL: http://127.0.0.1:8080
        run: |
          pnpm start --port 8081 > /tmp/nivaro-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health/ready; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - name: Verify container-served storefront
        run: pnpm test:e2e
      - name: Verify media queue recovery, catalog cache and catalog load
        working-directory: .
        shell: pwsh
        run: |
          docker tag nivaro-catalog:release nivaro-catalog:media-foundation
          docker tag nivaro-identity:release nivaro-identity:avatar-candidate
          docker tag nivaro-web:release nivaro-web:media-foundation
          ./scripts/Verify-CatalogMedia.ps1
          ./scripts/Verify-CatalogCache.ps1 -WithLoad
      - name: Identity and media browser journeys on a disposable stack
        working-directory: .
        shell: pwsh
        run: ./scripts/Verify-IdentityBrowser.ps1 -WithMedia
      - name: Verify database visibility and catalog outage recovery
        env:
          NIVARO_DEMO_RUNTIME_CHECK: '1'
        run: node scripts/verify-catalog-runtime.mjs
      - name: Restore all service databases and media in an isolated release
        working-directory: .
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          docker compose -f compose.yaml -f compose.support.yaml build support-init
          docker pull python:3.13.18-slim-bookworm@sha256:93498f36dc7e24ef233bfdf6cc17d4b8bd32d94ee737143e906460d5f5a914c5
          ./scripts/Verify-ReleaseBackup.ps1 -Port 8089
      - name: Verify development file sync and hot reload
        working-directory: .
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait --wait-timeout 120
          docker compose -f compose.yaml -f compose.dev.yaml watch --no-up > /tmp/nivaro-watch.log 2>&1 &
          watch_pid=$!
          trap 'kill "$watch_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if grep -q 'Watch enabled' /tmp/nivaro-watch.log; then break; fi
            sleep 1
          done
          grep -q 'Watch enabled' /tmp/nivaro-watch.log
          node apps/web/scripts/verify-watch.mjs
      - name: Container diagnostics
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 100
      - name: Stop CI containers
        if: always()
        working-directory: .
        run: docker compose down
